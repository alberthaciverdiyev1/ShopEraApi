# ShopEra storefront + Laravel API catch-all vhost.
#
# Use this as the default ShopEra origin server block. Cloudflare DNS can point
# any custom domain to this same origin; no per-domain nginx vhost is needed.
#
# Required app env:
#   APP_URL=https://<public-domain>
#
# SvelteKit service env:
#   HOST=127.0.0.1
#   PORT=3000
#   HOST_HEADER=x-forwarded-host
#   PROTOCOL_HEADER=x-forwarded-proto
#   INTERNAL_API_URL=http://127.0.0.1/api

upstream shopera_storefront {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/ShopEra/public;
    index index.php;
    client_max_body_size 100m;

    # Cloudflare terminates TLS. Preserve the original host/protocol so
    # Svelte SSR and Laravel see the public domain.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # ^~ matches both "/api" and "/api/..." — otherwise a slash-less "/api"
    # would fall through to the SvelteKit proxy and 404.
    location ^~ /api {
        try_files $uri /index.php?$query_string;
    }

    # ^~ matches both "/admin" and "/admin/..." so the bare "/admin" URL is
    # sent to Laravel (which redirects to /admin/login) instead of the
    # SvelteKit SSR server.
    location ^~ /admin {
        try_files $uri /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://shopera_storefront;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
