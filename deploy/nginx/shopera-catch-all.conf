# ShopEra storefront + Laravel API catch-all vhost.
#
# Use this as the default ShopEra origin server block. Cloudflare DNS can point
# any custom domain to this same origin; no per-domain nginx vhost is needed.
#
# The storefront is served by Laravel (Blade); there is no separate Node process.
#
# Required app env:
#   APP_URL=https://<public-domain>

server {
    listen 80 default_server;
    server_name _;

    root /var/www/ShopEra/public;
    index index.php;
    client_max_body_size 100m;

    # Cloudflare terminates TLS. Preserve the original host/protocol so Laravel
    # sees the public domain.
    location / {
        try_files $uri /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
