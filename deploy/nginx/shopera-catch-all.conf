# ShopEra storefront + Laravel API catch-all vhost.
#
# Use this as the default ShopEra origin server block. Cloudflare DNS can point
# any generated subdomain or custom domain to this same origin; no per-domain
# nginx vhost is needed. Laravel resolves the tenant from the incoming Host.
#
# Required app env:
#   TENANCY_ENABLED=true
#   MANAGER_URL=https://manager.example.com
#   MANAGER_INSTANCE_URL=https://origin-or-public-shopera-url
#
# SvelteKit service env:
#   HOST=127.0.0.1
#   PORT=3000
#   HOST_HEADER=x-forwarded-host
#   PROTOCOL_HEADER=x-forwarded-proto
#   INTERNAL_API_URL=http://127.0.0.1/api

upstream shopera_storefront {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/ShopEra/public;
    index index.php;
    client_max_body_size 100m;

    # Cloudflare terminates TLS. Preserve the original host/protocol so
    # Svelte SSR and Laravel tenancy both see the tenant domain.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    location /admin/ {
        try_files $uri /index.php?$query_string;
    }

    location /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://shopera_storefront;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
