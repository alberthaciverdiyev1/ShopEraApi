name: Deploy ShopEra

on:
  push:
    branches: [main]
  workflow_dispatch:

# Ayni anda tek deploy; bitmeden yenisini baslatma.
concurrency:
  group: deploy-shopera
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuda deploy (SSH)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          # (Alternatif: anahtar kullanmak isterseniz 'key: ${{ secrets.DEPLOY_SSH_KEY }}')
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            cd /var/www/ShopEra
            PULL=1 bash deploy/deploy.sh
